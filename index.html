<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c2029" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英単語カード">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>英単語カード</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 選んだ表示テーマを、画面を描く前に当てる（一瞬違う色で光らないように） -->
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem('ewc.prefs') || '{}').theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <button type="button" id="btn-manage" class="icon-btn" aria-label="データ管理">⚙</button>
    <h1 id="title">英単語カード</h1>
    <button type="button" id="btn-filter" class="icon-btn" aria-label="絞り込み">≡</button>
  </header>

  <main>
    <section id="view-list" class="view"></section>
    <section id="view-card" class="view" hidden></section>
    <section id="view-quiz" class="view" hidden></section>
    <section id="view-manage" class="view" hidden></section>
  </main>

  <nav class="tabbar">
    <button type="button" data-view="list"><span class="tab-icon">☰</span>一覧</button>
    <button type="button" data-view="card"><span class="tab-icon">▭</span>カード</button>
    <button type="button" data-view="quiz"><span class="tab-icon">✓</span>四択</button>
  </nav>

  <div id="filter-sheet" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-body" role="dialog" aria-label="絞り込み"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- integrity：配信元で中身がすり替えられていたら読み込まない（ハッシュは 0.20.3 のもの） -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
          integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT"
          crossorigin="anonymous"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/list.js"></script>
  <script src="js/card.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/manage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
